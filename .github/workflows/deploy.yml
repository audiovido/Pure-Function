name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      # Supabase URL + publishable key come from .env.production (public values)
      - name: Build
        run: npm run build
        env:
          # Quick login (optional): set under GitHub > Settings > Secrets and variables > Actions > Variables.
          # Public in the built app, so use a throwaway test client. Leave unset to turn quick login off.
          VITE_TEST_CLIENT_EMAIL: ${{ vars.VITE_TEST_CLIENT_EMAIL }}
          VITE_TEST_CLIENT_PASSWORD: ${{ vars.VITE_TEST_CLIENT_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
